[profile.default]
solc = "0.8.34"
auto_detect_solc = false
# cancun, not the reference's osaka: a later phase deploys our own contract to Arbitrum Sepolia.
evm_version = "cancun"
optimizer = true
optimizer_runs = 10000
src = "contracts/src"
test = "contracts/test"
out = "out"
libs = ["lib"]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[lint]
# vendored code triggers lint notes; they are not ours to fix
lint_on_build = false
